<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>{% block title %}DataProcess{% endblock %}{% if not standalone_lif %} — DataProcess{% endif %}</title>
<link rel="icon" href="/static/favicon.ico" sizes="any"/>
<link rel="stylesheet" href="/static/style.css"/>
{% block head %}{% endblock %}
</head>
<body>

{% include "partials/top_nav.html" %}

<!-- ─── Page body ─── -->
{% block body %}
<div class="app-shell">
  <!-- Control panel -->
  <aside class="ctrl-panel" id="ctrlPanel">
    {% block controls %}{% endblock %}
    {% include "partials/control_panel_extras.html" %}
  </aside>
  <!-- Main content -->
  <main class="main-content" id="mainContent">
    {% block main %}{% endblock %}
  </main>
</div>
{% endblock %}

<!-- ─── Toast ─── -->
<div id="toast"></div>

{% include "partials/preferences_modal.html" %}

<!-- ─── Shared JS utilities ─── -->
<script>
const APP_LABEL = {{ ('Leica LIF Browser' if standalone_lif else 'DataProcess Web') | tojson }};
const CURRENT_VIEW = {{ (active|default('index')) | tojson }};
const DEFAULT_DATA_DIR = {{ default_data_dir | tojson }};
const GENERIC_SETTINGS_ENABLED = {{ ((active|default('index')) not in ['scripts', 'run_history', 'fluorescence', 'fluorescence_roi', 'fluorescence_gif']) | tojson }};
const GENERIC_FILE_PROFILE_ENABLED = {{ ((active|default('index')) in ['csv_viewer', 'abf_viewer', 'echem_pc', 'echem_pv', 'rhd_viewer', 'emg_peaks']) | tojson }};
let _prefsCache = null;
let _prefsPath = '';
let _genericPrefs = {};
let _genericFileProfileState = null;

</script>
<script src="/static/js/dp_settings_schema.js"></script>
<script src="/static/js/dp_core.js"></script>
<script src="/static/js/dp_manifest.js"></script>
<script src="/static/js/dp_settings.js"></script>
<script src="/static/js/dp_profiles.js"></script>
<script src="/static/js/dp_jobs.js"></script>
<script>

document.addEventListener('DOMContentLoaded', async () => {
  /* Auto-fill path inputs with the default data dir */
  await applyInitialPathDefaults();
  await dpConsumePendingRunManifest();

  /* Hide ctrl-panel if it has no content (full-width pages) */
  const ctrl = document.getElementById('ctrlPanel');
  const main = document.getElementById('mainContent');
  if (ctrl && main && (!ctrl.innerHTML || !ctrl.innerHTML.trim())) {
    ctrl.style.cssText = 'width:0;padding:0;border:none;overflow:hidden';
  }
});

</script>
{% block scripts %}{% endblock %}
</body>
</html>

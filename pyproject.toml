[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bioelectronics-toolkit"
version = "0.7.0"
description = "Desktop GUIs and a lightweight Flask web app for processing bioelectronics and electrophysiology data (ABF, RHD, TIFF, electrochemistry CSV)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Guangqing Yang", email = "guangqing@uchicago.edu" }
]
keywords = [
    "bioelectronics",
    "electrophysiology",
    "patch-clamp",
    "EMG",
    "fluorescence",
    "electrochemistry",
    "ABF",
    "RHD",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "flask>=3.0",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyabf>=2.3",
    "pydantic>=2.6",
    "readlif>=0.6.6",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "Pillow>=10.0",
    "pyserial>=3.5",
    "tifffile>=2023.7",
    "imagecodecs>=2024.1",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "coverage>=7.5",
    "playwright>=1.40",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.urls]
Repository = "https://github.com/guangqingy/bioelectronics_toolkit"
PyPI = "https://pypi.org/project/bioelectronics-toolkit/"

# ---------------------------------------------------------------------------
# Entry points – desktop commands open the canonical WebGUI page.
# Processing logic belongs in services/*, not in desktop GUI callbacks.
# ---------------------------------------------------------------------------
[project.scripts]
bte-abf-batch      = "desktop_apps.web_launcher:abf_batch_main"
bte-abf-peaks      = "desktop_apps.web_launcher:abf_peaks_main"
bte-abf-sweep      = "desktop_apps.web_launcher:abf_sweep_main"
bte-abf-pc-viewer  = "desktop_apps.web_launcher:abf_pc_viewer_main"
bte-abf-pc-figure  = "desktop_apps.web_launcher:abf_pc_figure_main"
bte-echem-pc       = "desktop_apps.web_launcher:echem_pc_main"
bte-echem-pv       = "desktop_apps.web_launcher:echem_pv_main"
bte-rhd-viewer     = "desktop_apps.web_launcher:rhd_viewer_main"
bte-emg-viewer     = "desktop_apps.web_launcher:emg_rhd_main"
bte-emg-peaks      = "desktop_apps.web_launcher:emg_peaks_main"
bte-fl-roi         = "desktop_apps.web_launcher:fluorescence_roi_main"
bte-fl-lut         = "desktop_apps.web_launcher:fluorescence_lut_main"
bte-fl-gif         = "desktop_apps.launchers.fluorescence_tiff_to_gif:main"
bte-fl-preview-export = "desktop_apps.native.fluorescence_preview_export_gui:main"
bte-fl-manual-roi = "desktop_apps.native.fluorescence_manual_roi_gui:main"
bte-fl-marker-roi = "desktop_apps.cli.fluorescence_marker_roi_analysis:main"
bte-csv-viewer     = "desktop_apps.web_launcher:csv_viewer_main"
bte-histology      = "desktop_apps.web_launcher:histology_main"
bte-histology-analysis = "desktop_apps.web_launcher:histology_analysis_main"
bte-histology-line-measure = "desktop_apps.native.histology_line_measure_gui:main"
bte-web            = "web_app:main"

# ---------------------------------------------------------------------------
# Setuptools – package maintained code; desktop launchers live under desktop_apps.
# ---------------------------------------------------------------------------
[tool.setuptools]
py-modules = [
    "config",
    "web_app",
]

[tool.setuptools.packages.find]
include = [
    "desktop_apps*",
    "examples*",
    "services*",
    "vendor*",
    "web_api*",
    "web_static*",
    "web_templates*",
]

[tool.setuptools.package-data]
examples = [
    "sample_echem_photocurrent.csv",
    "sample_fluorescence_stack.tif",
    "sample_patch_clamp.abf",
]
web_static = ["**/*"]
web_templates = ["**/*"]

[tool.setuptools.exclude-package-data]
web_static = ["**/__pycache__/*", "**/*.pyc", "**/*.pyo"]
web_templates = ["**/__pycache__/*", "**/*.pyc", "**/*.pyo"]

# ---------------------------------------------------------------------------
# Ruff linter (optional – run with `ruff check .`)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Baseline CI lint: catch syntax-level and undefined-name issues without
# failing historical scientific scripts on historical style/layout differences.
# CI also runs a stricter E/F/W/I command against services, tests, and desktop
# launchers plus an all-web_api F gate.
select = ["E9", "F63", "F7", "F82"]
ignore = ["E402"]

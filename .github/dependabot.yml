version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    # Keep version-update noise out of the PR list; GitHub still allows security
    # update customization with this Dependabot config present.
    open-pull-requests-limit: 0
    groups:
      python-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Keep version-update noise out of the PR list; GitHub still allows security
    # update customization with this Dependabot config present.
    open-pull-requests-limit: 0
    groups:
      github-actions:
        patterns:
          - "*"

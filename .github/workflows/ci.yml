name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel any earlier in-progress run on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system Tk (so tkinter is importable)
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends python3-tk

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: compileall smoke check
        run: |
          python -m compileall -q -f \
            $(git ls-files '*.py' | grep -v '^\.dataprocess_cache/')

      - name: unittest discover
        run: python -m unittest discover -s tests -v

  lint:
    name: ruff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff
      - run: ruff check .

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel any earlier in-progress run on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system Tk (so tkinter is importable)
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends python3-tk

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: compileall smoke check
        run: |
          python -m compileall -q -f \
            $(git ls-files '*.py' | grep -v '^\.dataprocess_cache/')

      - name: pytest unit tests
        run: python -m pytest tests --ignore=tests/e2e -v

      - name: service coverage report
        run: |
          coverage run --source=services -m pytest tests --ignore=tests/e2e
          coverage report --show-missing --fail-under=62
          coverage xml -o coverage-services.xml

      - name: upload service coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: service-coverage-py${{ matrix.python-version }}
          path: coverage-services.xml
          if-no-files-found: error

      - name: web_api/services baseline ratchet
        run: python dev_scripts/check_services_ratio.py

      - name: private service boundary check
        run: python dev_scripts/check_private_service_usage.py
      - name: pyplot thread-safety guard
        run: python dev_scripts/check_no_pyplot.py

  lint:
    name: ruff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff
      - name: Baseline repository lint
        run: ruff check .
      - name: Strict lint for maintained service and Web entry layers
        run: ruff check services tests desktop_apps/web_launcher.py desktop_apps/launchers desktop_apps/native desktop_apps/cli --select E,F,W,I --ignore E402,E501
      - name: Strict unused-name lint for Web API modules
        run: ruff check web_api --select F --ignore E402,E501

  e2e:
    name: playwright e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run Playwright smoke tests
        run: python -m pytest tests/e2e
      - name: Upload Playwright artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-artifacts
          path: test-results/e2e
          if-no-files-found: ignore

  windows-smoke:
    name: windows smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Import web app
        run: python -c "import web_app; print(web_app.APP_VERSION_LABEL)"
      - name: py_compile smoke check
        shell: python
        run: |
          import pathlib
          import py_compile

          for path in pathlib.Path(".").rglob("*.py"):
              if ".dataprocess_cache" in path.parts:
                  continue
              py_compile.compile(str(path), doraise=True)

  locked-install:
    name: locked install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install from lock constraints
        run: |
          python -m pip install --upgrade pip
          pip install -c requirements-lock.txt -e ".[dev]"
      - name: Self-check and golden examples
        run: |
          python web_app.py --self-check --no-browser
          python -m pytest tests/test_self_check.py tests/test_golden_examples.py -q
